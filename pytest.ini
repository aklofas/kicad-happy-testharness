[pytest]
testpaths = tests integration
norecursedirs = fixtures __pycache__ .venv repos results reference old docs
python_files = test_*.py
strict_markers = true
addopts = -p no:cacheprovider
markers =
    unit: offline, corpus-free, fast; default required tier (pre-push hook, CI smoke)
    offline_contract: analyzer envelope/schema contracts on tracked fixtures; required tier
    corpus: reads repos/, results/ or reference/ data; opt-in with -m corpus
    online: needs network or credentials; opt-in with -m online
    perf: wall-clock bounds; opt-in with -m perf
